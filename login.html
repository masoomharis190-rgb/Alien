<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Alien.ai</title>
    <style>
        :root{color-scheme:dark;--bg:#07060d;--card:#14111f;--line:rgba(255,255,255,.1);--tx:#f4f2fb;--mu:#a29cb8;--ac:#7c5cff;--green:#22e6a8}
        *{box-sizing:border-box}
        body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,rgba(124,92,255,.2),transparent 55%),var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
        .card{width:min(440px,100%);padding:36px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 24px 80px #0008}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;font-size:21px;font-weight:800}
        .brand-mark{width:32px;height:32px;flex:none;filter:drop-shadow(0 3px 8px rgba(124,92,255,.35))}
        h1{margin:0 0 8px;font-size:28px}
        .intro{margin:0 0 24px;color:var(--mu)}
        button,input{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}
        input{margin:0 0 12px;background:#0d0b16;color:var(--tx)}
        input::placeholder{color:#777187}
        button{background:#fff;color:#202124;font-weight:600;cursor:pointer}
        button:hover:not(:disabled){background:#f1f1f1}
        button:disabled{opacity:.6;cursor:wait}
        .password-sign-in{margin-top:4px;background:linear-gradient(135deg,var(--ac),#b05cff);color:#fff}
        .status{min-height:24px;margin:14px 0 0;color:var(--mu);font-size:14px}
        .status.error{color:#ff8795}
        .back{display:inline-block;margin-top:22px;color:#c5b9ff;text-decoration:none}
        .back:hover{text-decoration:underline}
    </style>
</head>
<body>
    <main class="card">
        <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="brand-bg-login" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#805cff"/><stop offset="1" stop-color="#20dcb2"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#brand-bg-login)"/><path d="M16 5.5c-5.7 0-9.5 4.3-9.5 10 0 4.7 3.6 8.7 9.5 11 5.9-2.3 9.5-6.3 9.5-11 0-5.7-3.8-10-9.5-10Z" fill="#f8f7ff"/><path d="M9.6 15.3c1.4-2.1 3.7-2 5-.1-.9 2.8-3.3 4-5 .1Zm7.8-.1c1.3-1.9 3.6-2 5 .1-1.7 3.9-4.1 2.7-5-.1Z" fill="#47328b"/><path d="M13.5 21c1.6 1 3.4 1 5 0" fill="none" stroke="#47328b" stroke-linecap="round" stroke-width="1.4"/><circle cx="16" cy="3.5" r="1.2" fill="#fff"/></svg>Alien.ai</div>
        <h1>Sign in to continue</h1>
        <p class="intro">Enter a username and password to open your demo dashboard.</p>
        <form id="passwordSignIn" novalidate>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" aria-label="Username" required>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
            <button class="password-sign-in" id="passwordButton" type="submit">Login</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="demo-auth.js"></script>
    <script>
        const status = document.getElementById("status");
        const passwordForm = document.getElementById("passwordSignIn");
        const passwordButton = document.getElementById("passwordButton");
        const showError = message => {
            status.textContent = message;
            status.classList.add("error");
        };

        try {
            if (window.AlienDemoAuth.getUsername()) {
                window.location.replace("dashboard.html");
            }
        } catch (error) {
            console.error("Could not read the demo login session:", error);
            showError("Browser storage is unavailable. Enable site storage and refresh this page.");
        }

        passwordForm.addEventListener("submit", async event => {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            if (!username || !password) {
                showError("Enter both a username and password.");
                return;
            }
            passwordButton.disabled = true;
            status.classList.remove("error");
            try {
                window.AlienDemoAuth.signIn(username);
                window.location.replace("dashboard.html");
            } catch (error) {
                console.error("Could not save the demo login session:", error);
                showError("Could not save your demo login. Enable browser storage and try again.");
                passwordButton.disabled = false;
            }
        });
    </script>
</body>
</html>
